<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Family Recipes</title>
    <meta
      name="description"
      content="Recipes, photos and the stories behind them, kept for the people who cook them."
    />
    <!-- Static card for shared links. A crawler does not run the SPA, so a per-recipe
         preview would need the Worker to inject these per URL; see HANDOVER Next actions 6b. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Enamel Vault" />
    <meta property="og:title" content="Family Recipes" />
    <meta
      property="og:description"
      content="Recipes, photos and the stories behind them, kept for the people who cook them."
    />
    <meta property="og:url" content="https://recipes.enamelvault.com/" />
    <link rel="canonical" href="https://recipes.enamelvault.com/" />
    <meta property="og:image" content="https://recipes.enamelvault.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Family Recipes, on an enamel plate against a pantry-green wall." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Zilla Slab used to be loaded from fonts.googleapis.com here. It is now served from
         our own domain (@font-face in src/index.css, files in public/fonts/), so that no page
         makes a third-party request and no visitor's IP reaches Google. Do not reintroduce a
         font CDN link: it would make the claim on /cookies false and a consent banner arguable.
         The preload is the one weight above the fold on every page, the wordmark in the header;
         without it the header flashes in the fallback serif on a cold load. -->
    <link
      rel="preload"
      href="/fonts/zilla-slab-700-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Blocking and in the head on purpose: it must set the theme before first paint, or
         every cold load flashes the wrong one. It is a file rather than an inline script
         because the Worker's Content-Security-Policy is script-src 'self'; see the file. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
