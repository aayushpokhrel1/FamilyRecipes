<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Family Recipes</title>
    <meta
      name="description"
      content="Recipes, photos and the stories behind them, kept for the people who cook them."
    />
    <!-- Static card for shared links. A crawler does not run the SPA, so a per-recipe
         preview would need the Worker to inject these per URL; see HANDOVER Next actions 6b. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Enamel Vault" />
    <meta property="og:title" content="Family Recipes" />
    <meta
      property="og:description"
      content="Recipes, photos and the stories behind them, kept for the people who cook them."
    />
    <meta property="og:url" content="https://recipes.enamelvault.com/" />
    <meta property="og:image" content="https://recipes.enamelvault.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Family Recipes, on an enamel plate against a pantry-green wall." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark = stored === "dark" || (stored !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
