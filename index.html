<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Family Recipes</title>
    <meta
      name="description"
      content="Recipes, photos and the stories behind them, kept for the people who cook them."
    />
    <!-- THE FALLBACK, not the answer. A crawler does not run the SPA, so the Worker rewrites
         these per URL before serving: enrichRecipePage for /recipes/:id, enrichShell for every
         other route. What is written here is only what a route with no copy of its own keeps.

         So the canonical below is the HOMEPAGE's, and it is correct only for the homepage.
         Every other route must have it rewritten, and when that was true of recipe pages
         alone, every other route told Google its real address was "/". Search Console filed
         five of the seven URLs in the sitemap as duplicates and indexed none of them. Add a
         tag here and you are setting a DEFAULT; decide what rewrites it. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Enamel Vault" />
    <meta property="og:title" content="Family Recipes" />
    <meta
      property="og:description"
      content="Recipes, photos and the stories behind them, kept for the people who cook them."
    />
    <meta property="og:url" content="https://recipes.enamelvault.com/" />
    <link rel="canonical" href="https://recipes.enamelvault.com/" />
    <meta property="og:image" content="https://recipes.enamelvault.com/og.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Family Recipes: bone enamel recipe plates racked on a deep green pantry wall." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Zilla Slab used to be loaded from fonts.googleapis.com here. It is now served from
         our own domain (@font-face in src/index.css, files in public/fonts/), so that no page
         makes a third-party request and no visitor's IP reaches Google. Do not reintroduce a
         font CDN link: it would make the claim on /cookies false and a consent banner arguable.
         The preload is the one weight above the fold on every page, the wordmark in the header;
         without it the header flashes in the fallback serif on a cold load. -->
    <link
      rel="preload"
      href="/fonts/zilla-slab-700-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Blocking and in the head on purpose: it must set the theme before first paint, or
         every cold load flashes the wrong one. It is a file rather than an inline script
         because the Worker's Content-Security-Policy is script-src 'self'; see the file. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
