name: CI

on:
  push:
    branches: [master]
  pull_request:

# One run per branch at a time, and a new push supersedes the one before it.
#
# This does NOT create runner capacity, and it is not a fix for a slow queue. What it stops is
# a pile-up: during a GitHub incident on 2026-10-05 (delays assigning hosted runners), runs
# from successive pushes sat queued together competing for the same runners, and the ones that
# never got a runner inside GitHub's window were cancelled, which arrives as a "CI failed"
# mail for a job that never executed a single step.
#
# With this, only the newest commit on a branch is ever waiting, so a cancellation is one we
# asked for rather than a mystery. The trade-off, accepted: pushing twice quickly kills the
# first run mid-flight, so the only commit CI speaks for is the newest one. On a solo project
# where master is the working branch, that is the commit that matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Not real credentials; the client only reads these at runtime in the
      # browser, but set them so any build-time env check stays happy.
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The ONLY check that covers supabase/functions/. `npm run build` typechecks the app and
      # skips the edge function (it is Deno), and `supabase functions deploy` uploads source
      # without parsing it, so a SyntaxError there deploys fine and then fails to BOOT: every
      # request, every mode, a 503. That shipped once. oxlint catches it and exits 1.
      - run: npm run lint
      - run: npm run build
      - run: npm test

  # The DB-layer guards (RLS, the replace_recipe_children column list, the search
  # RPC) only ever ran when someone remembered to type `npm run test:int` with a
  # local Supabase up. A guard nobody runs is not a guard: migration 0009 exists
  # because 0006 silently dropped a column, and that class of bug is invisible to
  # the unit suite by construction.
  #
  # Separate job, not extra steps on build-and-test: this one needs Docker and
  # takes minutes to boot Postgres, and it must not hold up lint/build/test.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # PINNED, not "latest", and the pin is the fix rather than tidiness. "latest" makes
      # setup-cli resolve the release through the GitHub API with no token, which is rate
      # limited per shared runner IP: CI went red on 2026-10-01 with "Failed to resolve
      # latest Supabase CLI release: rate limit exceeded" on a docs-only commit. A pinned
      # version skips that lookup entirely, and it also makes CI run the same CLI that
      # applied these migrations locally. Bump it deliberately.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      # Applies every migration on a fresh Postgres, so a migration that does not
      # apply cleanly fails here rather than on the cloud.
      - run: supabase start
      - name: Run integration tests
        run: |
          set -a
          eval "$(supabase status -o env)"
          set +a
          SB_URL="$API_URL" \
          SB_ANON_KEY="$ANON_KEY" \
          SB_SERVICE_KEY="$SERVICE_ROLE_KEY" \
          npm run test:int

  # Proves the push actually DEPLOYED. Nothing else here does: this workflow has no deploy
  # step, so a green tick above says the code is sound and nothing at all about whether it is
  # live. Cloudflare Workers Builds deploys on its own, from a webhook.
  #
  # On 2026-10-12 that webhook did not fire for one push. No build was created, nothing
  # failed, nothing notified, and the previous Worker went on answering 200 for over three
  # hours. /health/extract could not catch it either, because an outdated Worker is perfectly
  # healthy. This job is the alarm that was missing.
  #
  # Push to master only: a pull request never deploys, so polling for it would always fail.
  deployed:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      # No checkout: this job only needs the SHA and curl, and skipping it keeps the alarm
      # independent of the repository state it is reporting on.
      - name: Wait for the deployed Worker to report this commit
        env:
          EXPECTED: ${{ github.sha }}
        run: |
          # Generous on purpose. A red run here must always mean "look at this", so the
          # timeout has to clear a slow-but-healthy build rather than race it. The manual
          # build on 2026-10-12 took 36 seconds; this allows ten minutes.
          for i in $(seq 1 60); do
            # Cache-busted, because a CDN copy of the previous deploy reads as a pass. The
            # route also sends no-store, so this is belt and braces.
            got=$(curl -fsS "https://recipes.enamelvault.com/health/version?cb=$i$RANDOM" || echo "unreachable")
            if [ "$got" = "$EXPECTED" ]; then
              echo "Deployed: $got"
              exit 0
            fi
            echo "attempt $i: deployed=$got expected=$EXPECTED"
            sleep 10
          done
          echo
          echo "::error::Production is still serving '$got' after 10 minutes, not '$EXPECTED'."
          echo "The push did not deploy. Cloudflare Workers Builds most likely never fired."
          echo "See docs/OPERATIONS.md, 'Automatic is not a guarantee', for how to start a"
          echo "build by hand through the API."
          exit 1
