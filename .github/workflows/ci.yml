name: CI

on:
  push:
    branches: [master, feat/v1]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Not real credentials; the client only reads these at runtime in the
      # browser, but set them so any build-time env check stays happy.
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
